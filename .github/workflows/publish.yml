name: Publish Java Library

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          server-id: github

      - name: Verify Maven project
        run: |
          git log -1 --oneline
          mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout
          echo ""
          mvn help:evaluate -Dexpression=project.version -q -DforceStdout
          echo ""
          mvn help:evaluate -Dexpression=project.distributionManagement.repository.url -q -DforceStdout

      - name: Publish to GitHub Packages
        run: mvn --batch-mode --errors deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
